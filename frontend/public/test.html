<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>llm-live2d 测试页</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
    }
    .status.connected { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.connecting { background: #fff3cd; color: #856404; }
    
    #messages {
      border: 1px solid #ccc;
      height: 300px;
      overflow-y: scroll;
      padding: 10px;
      margin: 10px 0;
      background: #f9f9f9;
    }
    
    .input-area {
      display: flex;
      gap: 10px;
    }
    
    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }
    
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>llm-live2d 连接测试</h1>
  
  <div id="wsStatus" class="status connecting">WebSocket: 连接中...</div>
  <div id="llmStatus" class="status">LLM API: 未测试</div>
  
  <div id="messages"></div>
  
  <div class="input-area">
    <input type="text" id="userInput" placeholder="输入消息..." />
    <button onclick="sendMessage()">发送</button>
  </div>
  
  <script>
    const wsUrl = `ws://${location.hostname || 'localhost'}:8000/ws`;
    let ws;
    
    function log(msg, type = 'info') {
      const div = document.createElement('div');
      div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      div.style.color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'black';
      document.getElementById('messages').appendChild(div);
      document.getElementById('messages').scrollTop = 999999;
    }
    
    function updateWsStatus(status, text) {
      const el = document.getElementById('wsStatus');
      el.className = 'status ' + status;
      el.textContent = 'WebSocket: ' + text;
    }
    
    function connect() {
      log('正在连接: ' + wsUrl);
      ws = new WebSocket(wsUrl);
      
      ws.onopen = () => {
        log('WebSocket 连接成功！', 'success');
        updateWsStatus('connected', '已连接');
      };
      
      ws.onclose = () => {
        log('WebSocket 连接关闭', 'error');
        updateWsStatus('error', '已断开');
      };
      
      ws.onerror = (e) => {
        log('WebSocket 错误: ' + e, 'error');
        updateWsStatus('error', '连接失败');
      };
      
      ws.onmessage = (ev) => {
        log('收到消息: ' + ev.data);
        try {
          const action = JSON.parse(ev.data);
          log('Action 类型: ' + action.type, 'success');
        } catch (e) {
          log('解析失败: ' + e, 'error');
        }
      };
    }
    
    function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;
      
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        log('WebSocket 未连接', 'error');
        return;
      }
      
      log('发送: ' + text);
      ws.send(JSON.stringify({ type: 'user_message', text }));
      input.value = '';
    }
    
    document.getElementById('userInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    
    // 启动连接
    connect();
  </script>
</body>
</html>
